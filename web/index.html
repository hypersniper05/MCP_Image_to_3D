<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCP Image to 3D &mdash; 3D objects</title>
<link rel="icon" href="/assets/icon.png">
<style>
:root{--bg:#f4f6f9;--panel:#fff;--side:#eef1f5;--fg:#1b2230;--muted:#667085;--line:#dde2ea;--hover:#e6eaf0;
 --teal:#12a6aa;--coral:#f0705a;--accent:#0f8f93;--sel:#12a6aa;--danger:#d6453d;--ok:#1a9c5b;--warn:#c98a07;
 --shadow:0 8px 30px rgba(15,23,42,.18);--chk:#0000000f}
@media (prefers-color-scheme:dark){:root{--bg:#101826;--panel:#172133;--side:#131c2b;--fg:#e8edf4;--muted:#93a1b5;
 --line:#26324a;--hover:#1e2a40;--accent:#2fc0c4;--shadow:0 8px 30px rgba(0,0,0,.5);--chk:#ffffff12}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);
 display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px}
button:hover{background:var(--hover)}button:disabled{opacity:.5;cursor:default}
button.danger{color:var(--danger)}button.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}
button.ghost{border-color:transparent;background:transparent}button.ghost:hover{background:var(--hover)}
button.primary{background:var(--teal);border-color:var(--teal);color:#fff}button.primary:hover{filter:brightness(1.07)}
code{font:12.5px ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--hover);padding:2px 6px;border-radius:6px;word-break:break-all}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap}
.brand img{width:26px;height:26px;display:block;border-radius:7px}.brand b{color:var(--coral)}
#menu{display:none}
.search{flex:1;max-width:560px;margin:0 auto;position:relative}
.search input{width:100%;padding:8px 12px 8px 34px;border-radius:10px;border:1px solid var(--line);background:var(--bg);outline:none}
.search input:focus{border-color:var(--teal);box-shadow:0 0 0 3px #12a6aa33}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
#status{display:flex;align-items:center;gap:8px;white-space:nowrap;color:var(--muted);font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--warn);flex:none}.dot.ready{background:var(--ok)}.dot.error{background:var(--danger)}
.app{flex:1;display:flex;min-height:0}
aside{width:236px;flex:none;background:var(--side);border-right:1px solid var(--line);overflow:auto;padding:12px 8px;display:flex;flex-direction:column}
aside h4{margin:14px 10px 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--fg);user-select:none}
.nav:hover{background:var(--hover)}.nav.on{background:var(--teal);color:#fff}.nav.on .n{color:#fffc}
.nav .n{margin-left:auto;font-size:12px;color:var(--muted)}.nav.sub{padding-left:30px;font-size:13px}
.nav svg{width:16px;height:16px;flex:none}
.tw{border:0;background:none;padding:0 2px;margin-left:-4px;color:inherit;display:flex}.tw svg{transition:transform .15s}.tw.open svg{transform:rotate(90deg)}
.foot{margin-top:auto;padding:12px 10px 4px;font-size:12px;color:var(--muted)}.foot code{display:block;margin:4px 0}
main{flex:1;display:flex;flex-direction:column;min-width:0}
.bar{padding:10px 16px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row1 .sp{flex:1}
.bar h2{margin:0;font-size:17px}.bar .count{color:var(--muted)}
.sizer{display:flex;align-items:center;gap:6px;color:var(--muted)}.sizer svg{width:15px;height:15px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px}.chips:empty{display:none}.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 11px;font-size:12.5px;cursor:pointer;user-select:none;white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
select{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
input[type=range]{accent-color:var(--teal);width:110px}
.selbar{display:none;align-items:center;gap:8px;padding:8px 16px;background:var(--teal);color:#fff;flex-wrap:wrap}
.selbar.on{display:flex}.selbar button{background:#ffffff22;border-color:#ffffff55;color:#fff}.selbar button:hover{background:#ffffff38}
.selbar .sp{flex:1}.selbar b{font-size:15px}
#scroll{flex:1;overflow:auto;padding:4px 16px 40px;outline:none}
.group h3{position:sticky;top:0;z-index:2;margin:0;padding:12px 2px 8px;font-size:14px;background:var(--bg);display:flex;align-items:center;gap:10px}
.group h3 .gsel{font-size:12px;color:var(--muted);cursor:pointer;font-weight:500}.group h3 .gsel:hover{color:var(--teal)}
.group{content-visibility:auto;contain-intrinsic-size:auto 600px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile,180px),1fr));gap:8px}
.tile{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;cursor:pointer;background:
 repeating-conic-gradient(var(--chk) 0 25%,transparent 0 50%) 50%/16px 16px,var(--panel);outline:3px solid transparent;transition:outline-color .1s}
.tile img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .2s}
.tile:hover img{transform:scale(1.03)}
.tile .ck{position:absolute;top:7px;left:7px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:#0004;
 opacity:0;transition:opacity .12s;display:grid;place-items:center;box-shadow:0 1px 4px #0006}
.tile .ck svg{width:13px;height:13px;color:#fff;opacity:0}
.tile:hover .ck,.picking .tile .ck{opacity:1}
.tile.sel{outline-color:var(--sel)}.tile.sel .ck{opacity:1;background:var(--sel);border-color:#fff}.tile.sel .ck svg{opacity:1}
.tile.sel img{transform:scale(.92);border-radius:8px}
.tile .badges{position:absolute;top:7px;right:7px;display:flex;gap:4px}
.badge{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;background:#000a;color:#fff;letter-spacing:.02em}
.badge.q-low{background:#4a5568}.badge.q-medium{background:#0f7f83}.badge.q-high{background:#b0522d}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;font-size:11.5px;color:#fff;
 background:linear-gradient(transparent,#000b);opacity:0;transition:opacity .12s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile:hover .cap{opacity:1}
.tile.nothumb{display:grid;place-items:center;color:var(--muted);font-size:12px}
.empty{display:grid;place-items:center;text-align:center;color:var(--muted);padding:80px 20px}.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
/* viewer: the object itself is the existing /viewer page, framed here */
#viewer{position:fixed;inset:0;z-index:20;background:#0b1018;display:none;color:#e8edf4}
#viewer.on{display:flex}
.stage{flex:1;position:relative;display:flex;flex-direction:column;min-width:0}
.vtop{display:flex;align-items:center;gap:8px;padding:10px 14px}
.vtop .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.vtop button,.vtop a{border:1px solid #ffffff2a;background:#ffffff12;color:#fff;border-radius:8px;padding:6px 11px;text-decoration:none;font-size:13px}
.vtop button:hover,.vtop a:hover{background:#ffffff26}
.vframe{flex:1;border:0;width:100%;background:#0b1018}
.nav-btn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border-radius:10px;border:0;background:#ffffff14;color:#fff;font-size:26px}
.nav-btn:hover{background:#ffffff2a}#prev{left:8px}#next{right:8px}
.info{width:340px;flex:none;background:#131b29;border-left:1px solid #ffffff1a;overflow:auto;padding:18px}
.info.off{display:none}.info h4{margin:16px 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#93a1b5}
.info h4:first-child{margin-top:0}.info .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.info .kv span:nth-child(odd){color:#93a1b5}
.info code{background:#ffffff14;color:#e8edf4}.info button{border:1px solid #ffffff2a;background:#ffffff12;color:#fff;font-size:12px;padding:4px 10px;margin-top:6px}
#modal{position:fixed;inset:0;z-index:30;background:#0008;display:none;align-items:center;justify-content:center}
#modal.on{display:flex}#modal .box{background:var(--panel);border-radius:14px;padding:22px;max-width:420px;width:calc(100% - 32px);box-shadow:var(--shadow)}
#modal h3{margin:0 0 8px}#modal p{margin:0 0 18px;color:var(--muted)}#modal .acts{display:flex;justify-content:flex-end;gap:8px}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#1b2230;color:#fff;border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;font-size:13.5px}
.toast button{background:transparent;border:0;color:#5fd8db;font-weight:700;padding:0}
/* create dialog */
#create{position:fixed;inset:0;z-index:31;background:#0008;display:none;align-items:center;justify-content:center}
#create.on{display:flex}#create .box{background:var(--panel);border-radius:14px;padding:20px;width:min(480px,calc(100% - 32px));box-shadow:var(--shadow)}
#create h3{margin:0 0 4px}#create .hint{margin:0 0 12px;color:var(--muted);font-size:13px}
.field{margin:10px 0}.field label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.rowf{display:flex;gap:10px}.rowf>div{flex:1}.rowf>div:last-child{max-width:92px}
.acts{display:flex;gap:8px;align-items:center;margin-top:14px}#cstat{color:var(--muted);font-size:13px;margin-right:auto}
/* tags */
.tag{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--hover);border-radius:99px;padding:1px 9px;font-size:12px;margin:0 4px 4px 0}
.tag .x{opacity:.55;cursor:pointer;font-size:10px}.tag .x:hover{opacity:1}
.tagrow{display:flex;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.tagadd{border:1px solid #ffffff2a;background:#ffffff12;color:#fff;border-radius:8px;padding:4px 8px;font-size:12px;width:120px}
#vpanel .tag{background:#ffffff14;border-color:#ffffff2a;color:#e8edf4}
@media (max-width:760px){aside{position:fixed;z-index:15;top:52px;bottom:0;left:0;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
 aside.open{transform:none}#menu{display:inline-flex}#status .txt{display:none}.info{display:none}
 .nav-btn{width:36px;height:52px}.brand span{display:none}}
</style></head><body>
<header>
 <button id="menu" class="ghost" title="Views"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
 <div class="brand"><img src="/assets/icon.png" alt="" width="26" height="26"><span>MCP <b>Image to 3D</b></span></div>
 <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  <input id="q" type="search" placeholder="Search object ids and settings" autocomplete="off"></label>
 <div id="status"><span class="dot"></span><span class="txt">connecting...</span></div>
 <button id="newbtn" class="primary" title="Generate a 3D object from an image">Create</button>
</header>
<div class="app">
 <aside id="side"></aside>
 <main>
  <div class="bar"><div class="row1"><h2 id="title">All objects</h2><span class="count" id="count"></span>
   <span class="sp"></span><span id="trashacts"></span>
   <select id="sort" title="Sort"><option value="new">Newest first</option><option value="old">Oldest first</option>
    <option value="id">Object id</option><option value="bytes">File size</option><option value="splats">Splat count</option></select>
   <label class="sizer" title="Thumbnail size"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="7" height="7" rx="1"/></svg>
   <input id="size" type="range" min="110" max="340" step="10"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></label></div>
   <div class="chips" id="chips"></div></div>
  <div class="selbar" id="selbar"><b id="selcount"></b><button id="selall">Select all</button><button id="selnone">Clear</button>
   <span class="sp"></span><span id="selacts"></span></div>
  <div id="scroll" tabindex="-1"></div>
 </main>
</div>
<div id="viewer"><div class="stage"><div class="vtop"><div class="t" id="vtitle"></div><span id="vpos" style="opacity:.7;font-size:13px"></span>
 <span id="vbtns"></span><button id="vinfo" title="Info (I)">Info</button><button id="vclose" title="Close (Esc)">&#10005;</button></div>
 <iframe class="vframe" id="vframe" title="3D object"></iframe>
 <button class="nav-btn" id="prev" title="Previous">&#8249;</button><button class="nav-btn" id="next" title="Next">&#8250;</button></div>
 <div class="info" id="vpanel"></div></div>
<div id="create"><div class="box"><h3>Create a 3D object</h3>
 <p class="hint">One image of a single object. Keep the whole object inside the frame - the crop is cut from its own outline, so anything outside is lost.
 A straight-on view with a plain light background, or a transparent cut-out, reconstructs best.</p>
 <div class="field"><label>Image from this computer</label><input id="cfile" type="file" accept="image/*"></div>
 <div class="field"><label>&hellip;or an image URL</label><input id="curl" type="url" placeholder="https://&hellip; &nbsp;or&nbsp; an image already on this server"></div>
 <div class="rowf"><div class="field"><label>Quality</label><select id="cquality">
  <option value="low">Low &mdash; ~23 s, 2 MB</option><option value="medium" selected>Medium &mdash; ~44 s, 17 MB</option>
  <option value="high">High &mdash; ~89 s, 68 MB</option></select></div>
  <div class="field"><label>Mode</label><select id="cmode"><option value="real" selected>real (default)</option><option value="synthetic">synthetic</option></select></div>
  <div class="field"><label>Seed</label><input id="cseed" type="number" value="42" min="0" step="1"></div></div>
 <div class="acts"><span id="cstat"></span><button id="ccancel">Cancel</button><button id="cgo" class="primary">Create</button></div></div></div>
<div id="modal"><div class="box"><h3 id="mtitle"></h3><p id="mtext"></p><div class="acts"><button id="mno">Cancel</button>
 <button id="myes" class="danger solid"></button></div></div></div>
<div id="toasts"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICON={all:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
 tag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12V5a2 2 0 0 1 2-2h7l9 9-9 9z"/><circle cx="8" cy="8" r="1.4"/></svg>',
 trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
 chev:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 6 6 6-6 6"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><path d="m5 12 5 5 9-10"/></svg>'};
const QUALITY={low:'Low',medium:'Medium',high:'High',custom:'Custom'};
const kfmt=n=>n>=1048576?(n/1048576).toFixed(n>=10485760?0:1)+'M':n>=1024?Math.round(n/1024)+'k':String(n||0);
const S={items:[],trash:[],tags:{},trashCount:0,view:'all',quality:'',tag:'',q:'',sort:'new',size:180,sel:new Set(),anchor:null,
 shown:[],open:{days:true},cur:-1,up:0,bg:'black',seen:null};
const BGS=[{id:'black',name:'Black'},{id:'grey',name:'Grey'},{id:'light',name:'Light'},{id:'white',name:'White'}];
try{const p=JSON.parse(localStorage.getItem('idol.gallery')||'{}');S.sort=p.sort||S.sort;S.size=p.size||S.size;S.bg=p.bg||S.bg;S.up=p.up||S.up;Object.assign(S.open,p.open||{})}catch(e){}
function savePrefs(){try{localStorage.setItem('idol.gallery',JSON.stringify({sort:S.sort,size:S.size,open:S.open,bg:S.bg,up:S.up}))}catch(e){}}
function readHash(){const h=new URLSearchParams(location.hash.slice(1));S.view=h.get('view')||'all';S.quality=h.get('quality')||'';
 S.tag=h.get('tag')||'';S.q=h.get('q')||'';S.openId=h.get('open')||''}
function writeHash(){const h=new URLSearchParams();if(S.view!=='all')h.set('view',S.view);if(S.quality)h.set('quality',S.quality);
 if(S.tag)h.set('tag',S.tag);if(S.q)h.set('q',S.q);if(S.openId)h.set('open',S.openId);const s=h.toString();
 history.replaceState(null,'',s?'#'+s:location.pathname)}
// ---------------------------------------------------------------- data
async function load(){try{const d=await(await fetch(S.view==='trash'?'api/trash':'api/objects')).json();
 if(S.view==='trash'){S.trash=d.items;S.trashCount=(await(await fetch('api/objects')).json()).trash??S.trashCount}
 else{S.items=d.items;S.trashCount=d.trash;S.tags=d.tags||{}}
 render();if(S.openId&&S.cur<0){const i=S.shown.findIndex(e=>e.id===S.openId);if(i>=0)openViewer(i);else{S.openId='';writeHash()}}}
 catch(e){toast('Could not load the objects: '+e)}}
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
 const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||r.statusText);return d}
// ---------------------------------------------------------------- filtering
const isTrash=()=>S.view==='trash';
const stamp=e=>isTrash()?e.deleted||e.created||0:e.created||0;
const inView=e=>S.view==='all'?true:S.view==='day:'+dayKey(e.created)?true:S.view.startsWith('day:')?dayKey(e.created)===S.view.slice(4):true;
function words(e){return(e.id+' '+(e.tags||[]).join(' ')+' '+(QUALITY[e.quality]||e.quality)+' '+e.quality+' '+e.mode+' '+(e.steps??'')+' '+(e.seed??'')+' '+(e.splats??'')).toLowerCase()}
function dayKey(ts){return ts?new Date(ts*1000).toISOString().slice(0,10):'unknown'}
function filtered(){let list=(isTrash()?S.trash:S.items).filter(inView);
 if(S.tag)list=list.filter(e=>(e.tags||[]).includes(S.tag));
 const base=list;
 if(S.quality)list=list.filter(e=>e.quality===S.quality);
 if(S.q){const ws=S.q.toLowerCase().split(/\s+/).filter(Boolean);list=list.filter(e=>{const t=words(e);return ws.every(w=>t.includes(w))})}
 const key={new:(a,b)=>stamp(b)-stamp(a),old:(a,b)=>stamp(a)-stamp(b),id:(a,b)=>a.id.localeCompare(b.id),
  bytes:(a,b)=>(b.bytes||0)-(a.bytes||0),splats:(a,b)=>(b.splats||0)-(a.splats||0)}[S.sort];
 return{list:[...list].sort(key),base}}
function dayLabel(ts){if(!ts)return'Unknown date';const d=new Date(ts*1000),t=new Date();t.setHours(0,0,0,0);
 const d0=new Date(d);d0.setHours(0,0,0,0);const days=Math.round((t-d0)/864e5);
 if(days===0)return'Today';if(days===1)return'Yesterday';
 if(days<7)return d.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
 return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})}
const fmtBytes=b=>!b?'':b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
// ---------------------------------------------------------------- rendering
function viewTitle(){if(S.view==='all')return'All objects';if(S.view==='trash')return'Trash';
 if(S.view.startsWith('day:'))return dayLabel(new Date(S.view.slice(4)+'T12:00:00').getTime()/1000);return'Objects'}
function nav(id,label,count,icon,cls=''){return`<div class="nav ${cls} ${S.view===id?'on':''}" data-view="${esc(id)}">${icon||''}<span>${esc(label)}</span><span class="n">${count??''}</span></div>`}
function renderSide(){const days=new Map();S.items.forEach(e=>{const k=dayKey(e.created);days.set(k,(days.get(k)||0)+1)});
 const dk=[...days.keys()].sort().reverse();
 const tw=k=>`<button class="tw ${S.open[k]?'open':''}" data-tw="${k}">${ICON.chev}</button>`;
 let h='<h4>Library</h4>'+nav('all','All objects',S.items.length,ICON.all);
 h+=nav('days','By day',S.items.length,tw('days')+ICON.all);
 if(S.open.days)h+=dk.map(k=>nav('day:'+k,dayLabel(new Date(k+'T12:00:00').getTime()/1000),days.get(k),'','sub')).join('');
 const tg=Object.entries(S.tags);
 if(tg.length){h+='<h4>Tags</h4>'+(S.tag?`<div class="nav" data-tag=""><span>Clear tag filter</span></div>`:'')+
  tg.map(([t,n])=>`<div class="nav ${S.tag===t?'on':''}" data-tag="${esc(t)}">${ICON.tag}<span>${esc(t)}</span><span class="n">${n}</span></div>`).join('')}
 h+='<h4>&nbsp;</h4>'+nav('trash','Trash',S.trashCount||'',ICON.trash);
 h+=`<div class="foot">MCP endpoint (Streamable HTTP, no login)<code>${esc(location.origin+'/mcp')}</code>
  <button id="epcopy" class="ghost" style="padding:2px 6px;font-size:12px">Copy</button></div>`;
 $('#side').innerHTML=h}
function renderBar(base){$('#title').textContent=viewTitle();
 const present=[...new Set(base.map(e=>e.quality))].sort((a,b)=>Object.keys(QUALITY).indexOf(a)-Object.keys(QUALITY).indexOf(b));
 $('#chips').innerHTML=present.length>1?[`<span class="chip ${S.quality?'':'on'}" data-quality="">All</span>`].concat(
  present.map(k=>`<span class="chip ${S.quality===k?'on':''}" data-quality="${esc(k)}">${esc(QUALITY[k]||k)}</span>`)).join(''):'';
 $('#trashacts').innerHTML=isTrash()&&S.trash.length?'<button class="danger" id="empty">Empty trash</button>':'';
 $('#sort').value=S.sort;$('#size').value=S.size}
function tile(e,i){const tr=isTrash();const b=[`<span class="badge q-${esc(e.quality)}">${esc((QUALITY[e.quality]||e.quality).toUpperCase())}</span>`];
 if(e.splats)b.push(`<span class="badge">${kfmt(e.splats)}</span>`);
 const src=tr?`objects/${e.id}-thumb.jpg?trash=1`:`objects/${e.id}-thumb.jpg`;
 const pic=e.thumb?`<img loading="lazy" decoding="async" src="${src}" alt="input image for ${esc(e.id)}">`:'no thumbnail';
 return`<div class="tile ${S.sel.has(e.id)?'sel':''} ${e.thumb?'':'nothumb'}" data-i="${i}" title="${esc(e.id)}">${pic}
 <span class="ck" data-ck="${i}">${ICON.check}</span><span class="badges">${b.join('')}</span>
 <span class="cap">${esc(e.id)}${e.tags&&e.tags.length?' &middot; '+esc(e.tags.join(' ')):e.mode?' &middot; '+esc(e.mode):''}</span></div>`}
function render(){const oldId=S.cur>=0?(S.openId||(S.shown[S.cur]&&S.shown[S.cur].id)):null;
 renderSide();const {list,base}=filtered();S.shown=list;renderBar(base);
 for(const id of [...S.sel])if(!list.some(e=>e.id===id))S.sel.delete(id);
 $('#count').textContent=list.length+(list.length===1?' object':' objects');
 document.documentElement.style.setProperty('--tile',S.size+'px');
 const sc=$('#scroll');
 if(!list.length){sc.innerHTML=`<div class="empty"><div><b>${isTrash()?'The trash is empty':S.q||S.quality?'Nothing matches':'No objects yet'}</b>${
  isTrash()?'Deleted objects stay here until you empty the trash.':
  S.q||S.quality?'Try other words or another filter.':'Ask an MCP client to generate one, or POST an image to <code>/jobs</code>.'}</div></div>`;renderSel();syncViewer(oldId);return}
 const byDay=S.sort==='new'||S.sort==='old';let h='',last=null,open=false;
 list.forEach((e,i)=>{const lab=byDay?dayLabel(stamp(e)):'';
  if(lab!==last||!open){if(open)h+='</div></div>';h+=`<div class="group">${byDay?`<h3>${esc(lab)}<span class="gsel" data-gsel="${esc(lab)}">Select</span></h3>`:'<div style="height:10px"></div>'}<div class="grid">`;last=lab;open=true}
  h+=tile(e,i)});
 h+='</div></div>';sc.innerHTML=h;renderSel();syncViewer(oldId)}
// Keep the open viewer on the same object when a search or filter changes the list.
function syncViewer(id){if(id==null||S.cur<0)return;const i=S.shown.findIndex(e=>e.id===id);
 if(i<0){closeViewer();return}
 if(i!==S.cur){S.cur=i;$('#vpos').textContent=`${i+1} / ${S.shown.length}`;
  if(S.openId)writeHash();
  $('#prev').style.visibility=i>0?'':'hidden';$('#next').style.visibility=i<S.shown.length-1?'':'hidden'}}
function renderSel(){const n=S.sel.size;$('#selbar').classList.toggle('on',n>0);document.body.classList.toggle('picking',n>0);
 $('#selcount').textContent=n+(n===1?' selected':' selected');
 $('#selacts').innerHTML=isTrash()?'<button id="restore">Restore</button><button id="purge">Delete forever</button>'
  :'<button id="dl">Download</button><button id="del">Move to trash</button>';
 document.querySelectorAll('.tile').forEach(t=>t.classList.toggle('sel',S.sel.has(S.shown[+t.dataset.i].id)))}
// ---------------------------------------------------------------- selection
function toggle(i,on){const id=S.shown[i].id;(on??!S.sel.has(id))?S.sel.add(id):S.sel.delete(id);S.anchor=i}
function range(i){const a=S.anchor??i;const [lo,hi]=a<i?[a,i]:[i,a];for(let k=lo;k<=hi;k++)S.sel.add(S.shown[k].id)}
$('#scroll').addEventListener('click',e=>{const g=e.target.closest('[data-gsel]');if(g){const lab=g.dataset.gsel;
 const idx=S.shown.map((x,i)=>i).filter(i=>dayLabel(stamp(S.shown[i]))===lab);
 const all=idx.every(i=>S.sel.has(S.shown[i].id));idx.forEach(i=>toggle(i,!all));renderSel();return}
 const t=e.target.closest('.tile');if(!t)return;const i=+t.dataset.i;
 if(e.target.closest('[data-ck]')||e.ctrlKey||e.metaKey){toggle(i)}else if(e.shiftKey){range(i)}else if(S.sel.size){toggle(i)}else{openViewer(i);return}
 renderSel()});
$('#selall').onclick=()=>{S.shown.forEach(e=>S.sel.add(e.id));renderSel()};$('#selnone').onclick=()=>{S.sel.clear();renderSel()};
$('#selbar').addEventListener('click',async e=>{const id=e.target.id,ids=[...S.sel];if(!ids.length)return;
 if(id==='del')toTrash(ids);if(id==='dl')download(ids);if(id==='restore')restore(ids);
 if(id==='purge')confirmBox('Delete forever?',`${ids.length} object${ids.length>1?'s':''} will be deleted for good. This cannot be undone.`,'Delete forever',()=>purge(ids))});
// ---------------------------------------------------------------- actions
function confirmBox(title,text,yes,fn){$('#mtitle').textContent=title;$('#mtext').textContent=text;$('#myes').textContent=yes;$('#modal').classList.add('on');
 const close=()=>$('#modal').classList.remove('on');$('#mno').onclick=close;$('#myes').onclick=()=>{close();fn()};$('#myes').focus()}
// Take the objects out of the view the moment the click happens. Waiting for the
// round trip first left a trashed object reachable with prev/next for as long as
// the request took, which reads as "the delete did not work". load() below puts
// everything back in step with the server either way.
function dropLocal(ids){const gone=new Set(ids);if(S.cur>=0)closeViewer();S.sel.clear();
 S.items=S.items.filter(e=>!gone.has(e.id));S.trash=S.trash.filter(e=>!gone.has(e.id));render()}
async function toTrash(ids){const moved=S.items.filter(e=>ids.includes(e.id)).length;dropLocal(ids);S.trashCount+=moved;
 try{const d=await post('api/trash',{ids});await load();
  toast(`${d.moved.length} object${d.moved.length===1?'':'s'} moved to the trash`,'Undo',async()=>{await post('api/restore',{ids:d.moved});await load();toast('Restored')})}
 catch(e){await load();toast('Could not move to the trash: '+e.message)}}
async function restore(ids){S.trashCount=Math.max(0,S.trashCount-ids.length);dropLocal(ids);
 try{const d=await post('api/restore',{ids});await load();
  toast(`${d.restored.length} object${d.restored.length===1?'':'s'} restored`)}catch(e){await load();toast('Could not restore: '+e.message)}}
async function purge(ids){const all=ids||S.trash.map(e=>e.id);S.trashCount=Math.max(0,S.trashCount-all.length);dropLocal(all);
 try{const d=await post('api/purge',ids?{ids}:{});await load();
  toast(`${d.deleted.length} object${d.deleted.length===1?'':'s'} deleted for good`)}catch(e){await load();toast('Could not delete: '+e.message)}}
async function download(ids){if(ids.length===1){const a=document.createElement('a');a.href=`objects/${ids[0]}.ply${isTrash()?'?trash=1':''}`;a.download=`${ids[0]}.ply`;a.click();return}
 toast(`Bundling ${ids.length} objects...`);try{const r=await fetch('api/zip',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})});
 if(!r.ok)throw new Error((await r.json()).detail||r.statusText);const blob=await r.blob();const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download='idol-objects.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),6e4)}
 catch(e){toast('Could not download: '+e.message)}}
function toast(text,action,fn){const t=document.createElement('div');t.className='toast';t.innerHTML=`<span>${esc(text)}</span>`;
 if(action){const b=document.createElement('button');b.textContent=action;b.onclick=()=>{t.remove();fn()};t.appendChild(b)}
 $('#toasts').appendChild(t);setTimeout(()=>t.remove(),action?8000:3500)}
async function copyText(t){if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(t);return true}catch(e){}}
 const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:-1000px;opacity:0';
 document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();return ok}
async function copy(t,what){toast(await copyText(t)?`${what} copied`:'Select the text and press Ctrl+C')}
// ---------------------------------------------------------------- viewer
function viewerUrl(e){const q=new URLSearchParams({bare:'1',bg:S.bg});if(S.up)q.set('up','y');if(isTrash())q.set('trash','1');return `viewer/${e.id}?${q}`}
function fullViewerUrl(e){const q=new URLSearchParams({bg:S.bg});if(S.up)q.set('up','y');if(isTrash())q.set('trash','1');return `viewer/${e.id}?${q}`}
function plyUrl(e){return `objects/${e.id}.ply${isTrash()?'?trash=1':''}`}
// The backdrop lives in the embedded viewer; switching it is a postMessage, not a
// reload, so a 68 MB model is not re-parsed just to judge it against grey.
function setBg(id){if(!BGS.some(b=>b.id===id))id='black';S.bg=id;savePrefs();
 const name=(BGS.find(b=>b.id===id)||BGS[0]).name;const btn=document.getElementById('vbg');if(btn)btn.textContent='Background: '+name;
 const fr=$('#vframe');if(fr.src.includes('viewer/'))fr.contentWindow.postMessage({type:'bg',id},'*')}
// If the backdrop is changed while the iframe is still loading, send it again on load.
$('#vframe').addEventListener('load',()=>{const fr=$('#vframe');if(fr.src.includes('viewer/'))fr.contentWindow.postMessage({type:'bg',id:S.bg},'*')});
function cycleBg(){setBg(BGS[(BGS.findIndex(b=>b.id===S.bg)+1)%BGS.length].id)}
function openViewer(i){S.cur=i;$('#viewer').classList.add('on');showCur()}
function closeViewer(){S.cur=-1;S.openId='';writeHash();$('#vframe').src='about:blank';$('#viewer').classList.remove('on')}
function showCur(){const e=S.shown[S.cur];if(!e)return closeViewer();
 if(!isTrash()){S.openId=e.id;writeHash()}
 $('#vframe').src=viewerUrl(e);$('#vtitle').textContent=e.id;$('#vpos').textContent=`${S.cur+1} / ${S.shown.length}`;
 const btn=[`<a href="${fullViewerUrl(e)}" target="_blank" title="Open the full viewer in a new tab">Open</a>`,
  `<a href="${plyUrl(e)}" download>Download .ply</a>`,
  `<button id="vflip" title="Flip the up axis if the object appears on its side">${S.up?'Upright':'Flip upright'}</button>`,
  `<button id="vbg" title="Change the backdrop - a grey or light one makes a dark or pale object far easier to judge (B)">Background: ${(BGS.find(b=>b.id===S.bg)||BGS[0]).name}</button>`];
 btn.push(isTrash()?'<button id="vrest">Restore</button>':'<button id="vdel">Move to trash</button>');
 $('#vbtns').innerHTML=btn.join(' ');
 const cam=e.camera||{},rows=[['Quality',QUALITY[e.quality]||e.quality],['Splats',e.splats?e.splats.toLocaleString():''],
  ['Sampler',e.steps?`${e.steps} steps`:''],['Mode',e.mode||''],['Seed',e.seed??''],['Generation',e.seconds?`${e.seconds} s`:''],
  ['File',fmtBytes(e.bytes)],['Created',e.created?new Date(e.created*1000).toLocaleString():''],
  ['Deleted',e.deleted?new Date(e.deleted*1000).toLocaleString():''],
  ['Camera',cam.radius?`yaw ${cam.yaw.toFixed(2)}, pitch ${cam.pitch.toFixed(2)}, fov ${cam.fov.toFixed(1)}`:'']];
 let h=`<h4>View link</h4><code>${esc(location.origin+'/viewer/'+e.id)}</code><br><button data-copy="${esc(location.origin+'/viewer/'+e.id)}" data-what="Link">Copy link</button>
 <h4>Tags</h4><div class="tagrow" id="tagrow"></div>
 <p style="color:#93a1b5;font-size:12px;margin:2px 0 0">Tags are what the search box looks at - name an object so you can find it again.</p>
 <h4>Download</h4><code>${esc(location.origin+'/objects/'+e.id+'.ply')}</code><br><button data-copy="${esc(location.origin+'/objects/'+e.id+'.ply')}" data-what="Download link">Copy link</button>
 <h4>Details</h4><div class="kv">${rows.filter(r=>r[1]!==''&&r[1]!=null).map(r=>`<span>${esc(r[0])}</span><span>${esc(r[1])}</span>`).join('')}</div>
 ${e.thumb?`<h4>Input image</h4><img src="objects/${e.id}-input.png${isTrash()?'?trash=1':''}" style="width:100%;border-radius:8px">`:''}`;
 $('#vpanel').innerHTML=h;renderTagRow(e);$('#prev').style.visibility=S.cur>0?'':'hidden';$('#next').style.visibility=S.cur<S.shown.length-1?'':'hidden'}
// Only the tag row is redrawn when a tag changes. Redrawing the whole panel would
// reset the iframe, and a 68 MB model should not re-parse because you typed a label.
function renderTagRow(e){const row=document.getElementById('tagrow');if(!row)return;
 row.innerHTML=(e.tags||[]).map(t=>`<span class="tag" data-untag="${esc(t)}" title="Remove tag">${esc(t)}<span class="x">&#10005;</span></span>`).join('')+
  '<input id="tagin" class="tagadd" placeholder="add tag + Enter" autocomplete="off">'}
$('#prev').onclick=()=>{if(S.cur>0){S.cur--;showCur()}};$('#next').onclick=()=>{if(S.cur<S.shown.length-1){S.cur++;showCur()}};
$('#vclose').onclick=closeViewer;$('#vinfo').onclick=()=>$('#vpanel').classList.toggle('off');
$('#viewer').addEventListener('click',e=>{const c=e.target.closest('[data-copy]');if(c)copy(c.dataset.copy,c.dataset.what);
 if(e.target.id==='vbg'){cycleBg();return}
 const u=e.target.closest('[data-untag]');if(u){const cur=S.shown[S.cur];if(cur)tagOp(cur.id,'remove',u.dataset.untag);return}
 if(e.target.id==='vdel'){toTrash([S.shown[S.cur].id])}if(e.target.id==='vrest'){restore([S.shown[S.cur].id]);closeViewer()}
 if(e.target.id==='vflip'){S.up=S.up?0:1;showCur()}});
$('#vpanel').addEventListener('keydown',e=>{if(e.target.id!=='tagin'||e.key!=='Enter')return;e.preventDefault();
 const cur=S.shown[S.cur];if(!cur)return;const v=e.target.value.trim().toLowerCase();if(!v)return;e.target.value='';tagOp(cur.id,'add',v)});
function tagIndex(){const c={};for(const e of S.items)for(const t of e.tags||[])c[t]=(c[t]||0)+1;
 return Object.fromEntries(Object.entries(c).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])))}
// The reply carries the full list from the server, so a fast second edit cannot be
// built from a stale copy and quietly drop the first.
async function tagOp(id,op,val){try{const d=await post('api/tags',{id,[op]:[val]});
 for(const list of[S.items,S.trash,S.shown]){const e=list.find(x=>x.id===id);if(e)e.tags=d.tags}
 S.tags=tagIndex();render();
 if(S.cur>=0){const idx=S.shown.findIndex(x=>x.id===id);
  if(idx>=0){S.cur=idx;renderTagRow(S.shown[idx]);const i=document.getElementById('tagin');if(i)i.focus()}else closeViewer()}}
 catch(e){toast('Could not save the tag: '+e.message)}}
// ---------------------------------------------------------------- side bar, bar, keys
$('#side').addEventListener('click',e=>{const t=e.target.closest('[data-tw]');if(t){S.open[t.dataset.tw]=!S.open[t.dataset.tw];savePrefs();renderSide();return}
 if(e.target.id==='epcopy')return copy(location.origin+'/mcp','Endpoint');
 const tg=e.target.closest('[data-tag]');if(tg){S.tag=tg.dataset.tag;writeHash();render();return}
 const n=e.target.closest('[data-view]');if(!n)return;S.view=n.dataset.view;S.quality='';S.sel.clear();writeHash();$('#side').classList.remove('open');
 load();$('#scroll').scrollTop=0});
$('#chips').addEventListener('click',e=>{const c=e.target.closest('[data-quality]');if(!c)return;S.quality=c.dataset.quality;writeHash();render()});
$('#trashacts').addEventListener('click',e=>{if(e.target.id==='empty')confirmBox('Empty the trash?',`${S.trash.length} object${S.trash.length>1?'s':''} will be deleted for good.`,'Empty trash',()=>purge(null))});
$('#sort').onchange=e=>{S.sort=e.target.value;savePrefs();render()};
$('#size').oninput=e=>{S.size=+e.target.value;document.documentElement.style.setProperty('--tile',S.size+'px')};
$('#size').onchange=()=>{savePrefs();render()};
let qt;$('#q').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{S.q=e.target.value.trim();writeHash();render()},150)};
$('#menu').onclick=()=>$('#side').classList.toggle('open');
document.addEventListener('keydown',e=>{const typing=/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
 if($('#create').classList.contains('on')){if(e.key==='Escape')closeCreate();return}
 if($('#modal').classList.contains('on')){if(e.key==='Escape')$('#modal').classList.remove('on');return}
 if(S.cur>=0){if(e.key==='Escape')closeViewer();else if(e.key==='ArrowLeft')$('#prev').click();else if(e.key==='ArrowRight')$('#next').click();
  else if(e.key==='i'||e.key==='I')$('#vinfo').click();else if(e.key==='b'||e.key==='B')cycleBg();return}
 if(typing){if(e.key==='Escape')e.target.blur();return}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){e.preventDefault();$('#selall').click()}
 else if(e.key==='Escape'){S.sel.clear();renderSel()}
 else if(e.key==='b'||e.key==='B'){cycleBg()}
 else if((e.key==='Delete'||e.key==='Backspace')&&S.sel.size){e.preventDefault();isTrash()?$('#purge').click():$('#del').click()}
 else if(e.key==='/'){e.preventDefault();$('#q').focus()}});
// ---------------------------------------------------------------- create
function openCreate(){$('#create').classList.add('on');$('#cstat').textContent='';$('#cfile').focus()}
function closeCreate(){$('#create').classList.remove('on');$('#cstat').textContent='';$('#cfile').value='';$('#curl').value=''}
function cstat(t){$('#cstat').textContent=t}
$('#newbtn').onclick=openCreate;$('#ccancel').onclick=closeCreate;
$('#create').addEventListener('click',e=>{if(e.target.id==='create')closeCreate()});
$('#cgo').onclick=async()=>{const btn=$('#cgo');btn.disabled=true;
 try{let image=$('#curl').value.trim();const f=$('#cfile').files[0];
  if(f){cstat(`Uploading ${f.name}...`);
   const r=await fetch('api/upload?name='+encodeURIComponent(f.name),{method:'POST',headers:{'Content-Type':f.type||'application/octet-stream'},body:f});
   const d=await r.json();if(!r.ok)throw new Error(d.detail||r.statusText);image=d.path}
  if(!image)throw new Error('choose an image, or paste a URL');
  cstat('Queued...');
  const rawSeed=$('#cseed').value.trim();const seed=rawSeed===''||!Number.isFinite(+rawSeed)?42:+rawSeed;
  const job=await post('jobs',{image,quality:$('#cquality').value,mode:$('#cmode').value,seed});
  for(;;){await new Promise(r=>setTimeout(r,3000));const s=await(await fetch('jobs/'+job.id)).json();
   if(s.state==='error')throw new Error(s.error||'generation failed');
   cstat(`${s.state}${s.seconds?` - ${s.seconds}s`:''}`);
   if(s.state==='done'){closeCreate();await load();toast(`Created ${job.id}`,'View',()=>openById(job.id));return}}}
 catch(e){cstat('');toast('Could not create: '+e.message)}finally{btn.disabled=false}};
function openById(id){const i=S.shown.findIndex(e=>e.id===id);if(i>=0)openViewer(i);else toast('That object is not in this view')};
// ---------------------------------------------------------------- status
async function status(){try{const s=await(await fetch('health')).json();
 const cls=s.ready?'ready':s.state==='error'?'error':'';
 const gpu=s.gpu&&s.gpu.name?s.gpu.name.replace('NVIDIA GeForce ',''):'GPU unavailable';
 const mem=s.gpu&&s.gpu.vram_total_mib?`${Math.round(s.gpu.vram_used_mib/102.4)/10} of ${Math.round(s.gpu.vram_total_mib/102.4)/10} GB`:'no VRAM data';
 const word={unloaded:'Model unloaded',loading:'Reloading model',warming:'Reloading model'}[s.state]||'Ready';
 let t=s.ready?`${word} · ${gpu} · ${mem}`
  :s.state==='error'?'Error: '+(s.error||''):s.state.charAt(0).toUpperCase()+s.state.slice(1)+'...';
 if(s.busy_with)t='Generating an object...';else if(s.queued)t=`${t} · ${s.queued} queued`;
 $('#status').innerHTML=`<span class="dot ${cls}"></span><span class="txt">${esc(t)}</span>`;$('#status').title=s.error||t;
 if(S.seen!==null&&s.objects_on_server!==S.seen&&!S.sel.size&&S.cur<0)load();S.seen=s.objects_on_server}
 catch(e){$('#status').innerHTML='<span class="dot error"></span><span class="txt">server not reachable</span>'}}
readHash();$('#q').value=S.q;
// Back/Forward and a pasted #open=<id> link all arrive here. writeHash() uses
// replaceState, which never fires this event, so reconciling cannot loop.
window.addEventListener('hashchange',()=>{readHash();$('#q').value=S.q;render();
 const i=S.shown.findIndex(e=>e.id===S.openId);
 if(i>=0){if(S.cur!==i)openViewer(i)}else if(S.cur>=0)closeViewer()});
load();status();setInterval(status,4000);
</script></body></html>
