services:
  mcp-image-to-3d:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: mcp-image-to-3d:latest
    container_name: mcp-image-to-3d
    ports:
      - "8043:8043"
    environment:
      # Pick the GPU the container should use. A UUID is more stable than an
      # index when several cards are installed (nvidia-smi -L lists them).
      # Example: CUDA_VISIBLE_DEVICES=GPU-1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
      CUDA_VISIBLE_DEVICES: "${CUDA_VISIBLE_DEVICES:-0}"
      NVIDIA_VISIBLE_DEVICES: all
      # Splat count is capped here because the decode stage grows with it.
      IDOL_MAX_GAUSSIANS: "1048576"
      # Free the GPU after this many seconds without a job; the next job reloads
      # the model. 0 keeps it loaded.
      IDOL_IDLE_UNLOAD_SECONDS: "${IDOL_IDLE_UNLOAD_SECONDS:-600}"
      # Force one address into every link, e.g. http://my-server:8043
      # IDOL_PUBLIC_BASE_URL: ""
      # Optional MCP DNS-rebinding allowlist. Leave unset on a trusted LAN.
      # IDOL_ALLOWED_HOSTS: "localhost:8043,192.168.1.20:8043"
    volumes:
      - ./data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
